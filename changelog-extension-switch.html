<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Extension Switch - 変更履歴">
    <title>Extension Switch - 変更履歴 | E-RAFT Lab</title>

    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="container">
            <div class="header-content">
                <div class="logo">
                    <a href="index.html" class="back-link">
                        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M12 4L6 10l6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                        </svg>
                        E-RAFT Lab
                    </a>
                </div>
                <div class="header-controls">
                    <div class="language-selector">
                        <label for="language-select" data-i18n="site.languageLabel">言語</label>
                        <select id="language-select" class="language-select">
                            <option value="ja">日本語</option>
                            <option value="en">English</option>
                        </select>
                    </div>
                    <button id="dark-mode-toggle" class="icon-button" aria-label="Dark mode toggle">
                        <svg class="moon-icon" width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z" fill="currentColor"/>
                        </svg>
                        <svg class="sun-icon" width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg" style="display: none;">
                            <path d="M10 2v2m0 12v2M4.22 4.22l1.42 1.42m8.72 8.72l1.42 1.42M2 10h2m12 0h2M4.22 15.78l1.42-1.42m8.72-8.72l1.42-1.42" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                            <circle cx="10" cy="10" r="3" stroke="currentColor" stroke-width="2"/>
                        </svg>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main">
        <div class="container">
            <div class="changelog-page">
                <div class="changelog-page-header">
                    <img src="images/extension-switch-icon.png" alt="Extension Switch" class="changelog-page-icon">
                    <div class="changelog-page-title-group">
                        <h1 class="changelog-page-title">Extension Switch</h1>
                        <p class="changelog-page-subtitle" data-i18n="site.changelogPageSubtitle">変更履歴</p>
                    </div>
                </div>

                <div class="changelog-page-content" id="changelog-content">
                    <!-- Changelog items will be dynamically inserted here -->
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <p class="footer-text">&copy; <span id="current-year"></span> eraft. All rights reserved.</p>
            <p class="footer-contact" data-i18n="site.footerContact">運営: E-RAFT ｜ お問い合わせ: info@e-raft.net</p>
        </div>
    </footer>

    <script src="changelog.js"></script>
</body>
</html>
