<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="日々の作業を効率化するツール - Chrome拡張機能、Webアプリ、スマホアプリ">
    <meta name="keywords" content="Productivity Tools, Chrome Extension, Web App, Mobile App, E-RAFT Lab">
    <meta name="author" content="eraft">

    <!-- Open Graph -->
    <meta property="og:title" content="E-RAFT Lab">
    <meta property="og:description" content="日々の作業を効率化するツール">
    <meta property="og:type" content="website">

    <title>E-RAFT Lab</title>

    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="container">
            <div class="header-content">
                <div class="logo">
                    <h1 class="site-title" data-i18n="site.title">E-RAFT Lab</h1>
                    <p class="site-subtitle" data-i18n="site.subtitle">日々の作業を効率化するツール</p>
                </div>
                <div class="header-controls">
                    <div class="language-selector">
                        <label for="language-select" data-i18n="site.languageLabel">言語</label>
                        <select id="language-select" class="language-select">
                            <option value="ja">日本語</option>
                            <option value="en">English</option>
                        </select>
                    </div>
                    <button id="dark-mode-toggle" class="icon-button" aria-label="Dark mode toggle">
                        <svg class="moon-icon" width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z" fill="currentColor"/>
                        </svg>
                        <svg class="sun-icon" width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg" style="display: none;">
                            <path d="M10 2v2m0 12v2M4.22 4.22l1.42 1.42m8.72 8.72l1.42 1.42M2 10h2m12 0h2M4.22 15.78l1.42-1.42m8.72-8.72l1.42-1.42" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                            <circle cx="10" cy="10" r="3" stroke="currentColor" stroke-width="2"/>
                        </svg>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main">
        <div class="container">
            <section class="extensions-section">
                <h2 class="section-title" data-i18n="site.myExtensions">私の拡張機能</h2>
                <div class="extensions-grid" id="extensions-grid">
                    <!-- Extension cards will be dynamically inserted here -->
                </div>
            </section>
        </div>
    </main>

    <!-- Extension Detail Modal -->
    <div id="extension-modal" class="modal" style="display: none;">
        <div class="modal-overlay" id="modal-overlay"></div>
        <div class="modal-content">
            <button class="modal-close" id="modal-close" aria-label="Close modal">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M18 6L6 18M6 6l12 12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                </svg>
            </button>

            <div class="modal-body-wrapper">
                <div class="modal-body">
                <div class="modal-header">
                    <img id="modal-icon" class="modal-icon" src="" alt="">
                    <div class="modal-title-group">
                        <h2 id="modal-title" class="modal-title"></h2>
                        <p id="modal-tagline" class="modal-tagline"></p>
                    </div>
                </div>

                <div class="modal-video-container">
                    <iframe id="modal-video" class="modal-video" src="" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
                </div>

                <div class="modal-description">
                    <p id="modal-description"></p>
                </div>

                <div class="modal-section">
                    <h3 data-i18n="site.features">主な機能</h3>
                    <ul id="modal-features" class="features-list"></ul>
                </div>

                <div class="modal-section">
                    <h3 data-i18n="site.privacy">プライバシー</h3>
                    <p id="modal-privacy"></p>
                </div>

                <div class="modal-meta">
                    <div class="meta-item">
                        <span class="meta-label" data-i18n="site.version">バージョン</span>
                        <span id="modal-version" class="meta-value"></span>
                    </div>
                    <div class="meta-item">
                        <span class="meta-label" data-i18n="site.languages">対応言語数</span>
                        <span id="modal-languages" class="meta-value"></span>
                    </div>
                </div>

                <div class="modal-actions">
                    <a id="modal-install-button" class="button button-primary" href="" target="_blank" rel="noopener noreferrer">
                        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M10 2v12m0 0l-4-4m4 4l4-4M4 14v2a2 2 0 002 2h8a2 2 0 002-2v-2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                        </svg>
                        <span data-i18n="site.installButton">Chrome に追加</span>
                    </a>
                </div>
            </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <p class="footer-text">&copy; <span id="current-year"></span> eraft. All rights reserved.</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
